services:
  mystiquill-postgres:
    image: postgres:16
    container_name: mystiquill-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: mystiquill
      POSTGRES_PASSWORD: mystiquill_dev
      POSTGRES_DB: mystiquill_dev
    volumes:
      - mystiquill_postgres_data:/var/lib/postgresql/data

volumes:
  mystiquill_postgres_data: